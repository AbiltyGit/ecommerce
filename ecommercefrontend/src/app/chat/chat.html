<div class="flex h-screen overflow-hidden w-full">
  <!-- Sidebar -->
  <aside class="w-64 glass-panel border-r border-white/5 flex flex-col h-full hidden md:flex shrink-0">
    <div class="p-6 border-b border-white/5 flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <h2 class="text-xl font-bold text-white tracking-tight">AI Analytics</h2>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-2">
      <button class="w-full text-left px-4 py-3 rounded-xl bg-indigo-500/20 text-indigo-300 font-medium border border-indigo-500/30 flex items-center gap-3 transition-all shadow-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>
        Data Exploration
      </button>
      <button (click)="goToDashboard()" class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-slate-400 font-medium transition-all flex items-center gap-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        Dashboards
      </button>
    </div>
    <div class="p-4 border-t border-white/5">
      <button (click)="logout()" class="w-full py-3 px-4 rounded-xl hover:bg-red-500/10 hover:text-red-400 text-slate-400 font-medium transition-colors flex items-center gap-3 justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-900/40">
    <!-- Header -->
    <header class="h-16 glass-panel border-b border-white/5 flex items-center justify-between px-6 z-10 shrink-0">
      <h1 class="text-lg font-semibold text-white flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-green-400 animate-pulse-slow shadow-[0_0_8px_rgba(74,222,128,0.6)]"></span>
        Ask the Database
      </h1>
      <div class="text-sm font-medium text-slate-400 flex items-center gap-2">
        Powered by LangGraph
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
    </header>

    <!-- Chat Messages -->
    <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth" #scrollContainer>
      <!-- Initial greeting -->
      <div class="flex flex-col items-center justify-center text-center mt-12 mb-8 animate-fade-in" *ngIf="messages.length === 0">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-500/20 to-purple-500/20 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(99,102,241,0.15)]">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <h2 class="text-3xl font-bold text-white mb-3">How can I help you?</h2>
        <p class="text-slate-400 max-w-md text-lg leading-relaxed">Ask anything about your e-commerce data. I can fetch reviews, analyze sales, and visualize metrics instantly.</p>
        <div class="mt-10 flex flex-wrap justify-center gap-3 w-full max-w-2xl">
          <button (click)="question = 'Show me the top 5 products by review count'; ask()" class="px-5 py-3 rounded-full bg-slate-800/50 border border-white/10 hover:border-indigo-500/50 hover:bg-indigo-500/10 text-sm font-medium text-slate-300 transition-all shadow-sm">Top 5 products by reviews</button>
          <button (click)="question = 'What is the average rating for Beauty category?'; ask()" class="px-5 py-3 rounded-full bg-slate-800/50 border border-white/10 hover:border-purple-500/50 hover:bg-purple-500/10 text-sm font-medium text-slate-300 transition-all shadow-sm">Average rating in Beauty</button>
        </div>
      </div>

      <!-- Messages Loop -->
      <div *ngFor="let msg of messages" class="animate-fade-in flex flex-col w-full" [ngClass]="msg.role === 'user' ? 'items-end' : 'items-start'">
        
        <div class="flex w-full" [ngClass]="msg.role === 'user' ? 'justify-end' : 'justify-start max-w-[95%] md:max-w-[85%]'">
          <!-- AI Avatar -->
          <div *ngIf="msg.role === 'assistant'" class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex-shrink-0 flex items-center justify-center mr-4 mt-1 shadow-lg shadow-indigo-500/20">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          
          <div class="flex flex-col" [ngClass]="msg.role === 'user' ? 'max-w-[85%] md:max-w-[70%]' : 'w-full'">
            <div class="p-5 rounded-2xl text-[15px] leading-relaxed shadow-sm" [ngClass]="msg.role === 'user' ? 'message-bubble-user text-white rounded-tr-sm' : 'message-bubble-ai text-slate-200 rounded-tl-sm'">
              <!-- Formatted Text -->
              <div class="whitespace-pre-wrap ai-content" [innerHTML]="formatMessage(msg.content)"></div>
            </div>
            
            <!-- Plotly Rendering Area -->
            <div *ngIf="msg.visualizationCode" class="mt-4 w-full">
              <app-plotly-render [code]="msg.visualizationCode"></app-plotly-render>
            </div>
            
            <!-- Raw Data Table (if data exists and is array) -->
            <div *ngIf="msg.data && msg.data.length > 0" class="mt-3 text-xs text-slate-400 p-4 bg-slate-800/40 rounded-xl overflow-x-auto border border-white/5 backdrop-blur-sm">
               <details>
                 <summary class="cursor-pointer hover:text-white font-medium transition-colors select-none">View Raw Data ({{msg.data.length}} rows)</summary>
                 <div class="mt-3 rounded-lg overflow-hidden border border-white/10">
                   <table class="w-full border-collapse text-left bg-slate-900/50">
                     <thead class="bg-slate-800/80 text-slate-300">
                       <tr>
                         <th *ngFor="let key of getObjectKeys(msg.data[0])" class="p-3 font-semibold border-b border-white/10">{{key}}</th>
                       </tr>
                     </thead>
                     <tbody class="divide-y divide-white/5">
                       <tr *ngFor="let row of msg.data | slice:0:5" class="hover:bg-white/5 transition-colors">
                         <td *ngFor="let key of getObjectKeys(row)" class="p-3 truncate max-w-[200px]">{{row[key]}}</td>
                       </tr>
                     </tbody>
                   </table>
                 </div>
                 <div *ngIf="msg.data.length > 5" class="text-center mt-3 text-slate-500 font-medium">... and {{msg.data.length - 5}} more rows</div>
               </details>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div *ngIf="loading" class="animate-fade-in flex items-start w-full">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex-shrink-0 flex items-center justify-center mr-4 mt-1 shadow-lg shadow-indigo-500/20">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="p-5 rounded-2xl message-bubble-ai text-slate-200 rounded-tl-sm flex items-center gap-2 shadow-sm h-[58px]">
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-bounce"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-purple-400 animate-bounce" style="animation-delay: 0.15s"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-bounce" style="animation-delay: 0.3s"></div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 md:p-6 glass-panel border-t border-white/5 z-10 shrink-0">
      <form (ngSubmit)="ask()" class="relative max-w-4xl mx-auto flex items-end gap-3">
        <div class="relative w-full">
          <input 
            type="text" 
            [(ngModel)]="question" 
            name="question"
            [disabled]="loading"
            class="w-full bg-slate-800/60 border border-white/10 px-6 py-4 rounded-2xl text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-inner backdrop-blur-md transition-all text-[15px]"
            placeholder="Ask about your sales, users, or products..."
            autocomplete="off"
          >
        </div>
        <button 
          type="submit" 
          [disabled]="loading || !question.trim()" 
          class="w-14 h-14 shrink-0 bg-gradient-to-tr from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:from-slate-700 disabled:to-slate-700 disabled:opacity-50 text-white rounded-2xl flex items-center justify-center transition-all shadow-lg shadow-indigo-500/25"
        >
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" [class.animate-pulse]="loading"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>
