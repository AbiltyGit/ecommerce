<div class="flex flex-col h-full overflow-y-auto bg-slate-900/40">

  <header class="h-14 glass-panel border-b border-white/5 flex items-center justify-between px-6 shrink-0 sticky top-0 z-10">
    <h1 class="text-base font-semibold text-white flex items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Store Management
    </h1>
    <span class="text-sm text-slate-400">{{ stores.length }} registered stores</span>
  </header>

  <div class="p-6 flex-1">
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 text-indigo-400">
      <div class="w-10 h-10 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin mb-4"></div>
      Loading stores...
    </div>

    <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <div *ngFor="let store of stores" class="glass-card rounded-2xl p-5 border flex flex-col gap-4 animate-fade-in transition-all"
           [ngClass]="store.isOpen ? 'border-white/5 hover:border-green-500/20' : 'border-white/5 opacity-60'">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center border"
                 [ngClass]="store.isOpen ? 'bg-green-500/10 border-green-500/20' : 'bg-slate-700/50 border-white/5'">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" [attr.stroke]="store.isOpen ? '#4ade80' : '#64748b'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <div>
              <h3 class="font-bold text-white">{{ store.name }}</h3>
              <p class="text-xs text-slate-500">ID #{{ store.id }} · Owner #{{ store.corporateUserId || 'N/A' }}</p>
            </div>
          </div>
          <span class="px-2 py-1 rounded-full text-xs font-bold uppercase tracking-wider border shrink-0"
                [ngClass]="store.isOpen ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-slate-700/50 text-slate-500 border-white/5'">
            {{ store.isOpen ? 'Open' : 'Closed' }}
          </span>
        </div>
        <p class="text-sm text-slate-400 flex-1">{{ store.description || 'No description provided.' }}</p>
        <button (click)="toggleStore(store)" [disabled]="togglingId === store.id"
                class="w-full py-2 rounded-xl text-sm font-medium transition-all border flex items-center justify-center gap-2"
                [ngClass]="store.isOpen ? 'bg-red-500/10 hover:bg-red-500/20 text-red-400 border-red-500/20' : 'bg-green-500/10 hover:bg-green-500/20 text-green-400 border-green-500/20'">
          <div *ngIf="togglingId === store.id" class="w-4 h-4 rounded-full border-2 border-current border-t-transparent animate-spin"></div>
          <span *ngIf="togglingId !== store.id">{{ store.isOpen ? '⛔ Close Store' : '✅ Open Store' }}</span>
        </button>
      </div>
    </div>
  </div>
</div>
