<div class="flex h-screen overflow-hidden w-full bg-slate-900/40">

  <!-- Sidebar -->
  <aside class="w-64 glass-panel border-r border-white/5 flex flex-col h-full hidden md:flex shrink-0">
    <div class="p-6 border-b border-white/5 flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <h2 class="text-xl font-bold text-white tracking-tight">Store Admin</h2>
    </div>
    <div class="flex-1 p-4 space-y-1">
      <button (click)="goBack()" class="w-full text-left px-4 py-3 rounded-xl hover:bg-white/5 text-slate-400 font-medium transition-all flex items-center gap-3">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        Dashboard
      </button>
      <button class="w-full text-left px-4 py-3 rounded-xl bg-green-500/20 text-green-300 font-medium border border-green-500/30 flex items-center gap-3 transition-all shadow-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Stores
      </button>
    </div>
    <div class="p-4 border-t border-white/5">
      <button (click)="logout()" class="w-full py-3 px-4 rounded-xl hover:bg-red-500/10 hover:text-red-400 text-slate-400 font-medium transition-colors flex items-center gap-3 justify-center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col h-full overflow-y-auto">
    <header class="h-16 glass-panel border-b border-white/5 flex items-center justify-between px-6 z-10 shrink-0 sticky top-0">
      <h1 class="text-lg font-semibold text-white flex items-center gap-2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Store Management
      </h1>
      <span class="text-sm text-slate-400">{{ stores.length }} registered stores</span>
    </header>

    <div class="p-6 md:p-8">

      <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 text-indigo-400">
        <div class="w-10 h-10 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin mb-4"></div>
        Loading stores...
      </div>

      <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">

        <div *ngFor="let store of stores" class="glass-card rounded-2xl p-6 border border-white/5 flex flex-col gap-4 hover:border-white/10 transition-all animate-fade-in"
             [class.opacity-60]="!store.isOpen">
          
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center border"
                   [ngClass]="store.isOpen ? 'bg-green-500/10 border-green-500/20' : 'bg-slate-700/50 border-white/5'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" [attr.stroke]="store.isOpen ? '#4ade80' : '#64748b'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              </div>
              <div>
                <h3 class="font-bold text-white text-base">{{ store.name }}</h3>
                <p class="text-xs text-slate-500">ID #{{ store.id }} · Owner #{{ store.corporateUserId || 'N/A' }}</p>
              </div>
            </div>
            <span class="px-2 py-1 rounded-full text-xs font-bold uppercase tracking-wider border shrink-0"
                  [ngClass]="store.isOpen ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-slate-700/50 text-slate-500 border-white/5'">
              {{ store.isOpen ? 'Open' : 'Closed' }}
            </span>
          </div>

          <p class="text-sm text-slate-400 flex-1">{{ store.description || 'No description provided.' }}</p>

          <button (click)="toggleStore(store)"
                  [disabled]="togglingId === store.id"
                  class="w-full py-2.5 rounded-xl text-sm font-medium transition-all border flex items-center justify-center gap-2"
                  [ngClass]="store.isOpen
                    ? 'bg-red-500/10 hover:bg-red-500/20 text-red-400 border-red-500/20'
                    : 'bg-green-500/10 hover:bg-green-500/20 text-green-400 border-green-500/20'">
            <div *ngIf="togglingId === store.id" class="w-4 h-4 rounded-full border-2 border-current border-t-transparent animate-spin"></div>
            <span *ngIf="togglingId !== store.id">
              {{ store.isOpen ? '⛔ Close Store' : '✅ Open Store' }}
            </span>
          </button>
        </div>

      </div>

    </div>
  </main>
</div>
