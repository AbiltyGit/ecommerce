<div class="flex flex-col h-full overflow-y-auto bg-slate-900/40">

  <!-- Header -->
  <header class="h-14 glass-panel border-b border-white/5 flex items-center justify-between px-6 shrink-0 sticky top-0 z-10">
    <h1 class="text-base font-semibold text-white flex items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      System Audit Logs
    </h1>
    <span class="text-sm text-slate-400">Monitoring all critical write operations</span>
  </header>

  <!-- Content -->
  <div class="p-6">
    <div *ngIf="loading" class="flex justify-center py-20">
      <div class="w-8 h-8 rounded-full border-2 border-indigo-500/30 border-t-indigo-500 animate-spin"></div>
    </div>

    <div *ngIf="!loading" class="glass-card rounded-2xl border border-white/5 overflow-hidden animate-fade-in">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-white/5 border-b border-white/5">
              <th class="p-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Timestamp</th>
              <th class="p-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">User</th>
              <th class="p-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Action</th>
              <th class="p-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Details</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-white/5">
            <tr *ngFor="let log of logs" class="hover:bg-white/[0.02] transition-colors">
              <td class="p-4 text-sm text-slate-400 font-mono">{{ log.timestamp | date:'short' }}</td>
              <td class="p-4 text-sm font-medium text-white">{{ log.username }}</td>
              <td class="p-4 text-sm">
                <span class="px-2 py-1 rounded text-xs font-medium border bg-blue-500/10 text-blue-400 border-blue-500/20">
                  {{ log.action }}
                </span>
              </td>
              <td class="p-4 text-sm text-slate-400">{{ log.details }}</td>
            </tr>
            <tr *ngIf="logs.length === 0">
              <td colspan="4" class="p-8 text-center text-slate-500">No audit logs found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
