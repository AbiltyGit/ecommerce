<div class="flex flex-col h-full overflow-y-auto bg-slate-900/40">

  <!-- Header -->
  <header class="h-14 glass-panel border-b border-white/5 flex items-center justify-between px-6 shrink-0 sticky top-0 z-10">
    <h1 class="text-base font-semibold text-white flex items-center gap-2">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      Purchase History
    </h1>
    <span class="text-sm text-slate-400">{{ orders.length }} orders</span>
  </header>

  <div class="p-6 flex-1">
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 text-indigo-400">
      <div class="w-10 h-10 rounded-full border-4 border-indigo-500/30 border-t-indigo-500 animate-spin mb-4"></div>
      Loading orders...
    </div>

    <div *ngIf="!loading && orders.length === 0" class="flex flex-col items-center justify-center py-20 text-slate-500">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-40"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
      <p class="mb-2">No orders yet.</p>
    </div>

    <div *ngIf="!loading && orders.length > 0" class="space-y-3">
      <div *ngFor="let order of orders" class="glass-card rounded-xl border border-white/5 p-5 hover:border-indigo-500/20 transition-colors animate-fade-in">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
            </div>
            <div>
              <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Order #{{ order.id }}</div>
              <div class="text-sm font-semibold text-white">{{ order.orderDate | date:'dd MMM yyyy, HH:mm' }}</div>
              <div class="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                {{ order.paymentMethod }}
              </div>
            </div>
          </div>
          <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider border self-start sm:self-auto"
                [ngClass]="{
                  'bg-yellow-500/10 text-yellow-400 border-yellow-500/20': order.status === 'PENDING',
                  'bg-indigo-500/10 text-indigo-400 border-indigo-500/20': order.status === 'PROCESSING',
                  'bg-blue-500/10 text-blue-400 border-blue-500/20': order.status === 'SHIPPED',
                  'bg-green-500/10 text-green-400 border-green-500/20': order.status === 'DELIVERED',
                  'bg-red-500/10 text-red-400 border-red-500/20': order.status === 'CANCELLED'
                }">
            {{ order.status }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
